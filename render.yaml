# Deploy each service separately on Render, or use this blueprint for all at once.
services:
  - type: web
    name: sdui-docs
    runtime: static
    staticPublishPath: sites/docs

  - type: web
    name: sdui-user-management
    runtime: static
    rootDir: sites/user-management
    buildCommand: cd ../.. && pnpm install && pnpm --filter "./packages/*" run build && pnpm --filter sdui-site-user-management run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: sdui-crm-dashboard
    runtime: static
    rootDir: sites/crm-dashboard
    buildCommand: cd ../.. && pnpm install && pnpm --filter "./packages/*" run build && pnpm --filter sdui-site-crm-dashboard run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: sdui-analytics-dashboard
    runtime: static
    rootDir: sites/analytics-dashboard
    buildCommand: cd ../.. && pnpm install && pnpm --filter "./packages/*" run build && pnpm --filter sdui-site-analytics-dashboard run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: sdui-form-builder
    runtime: static
    rootDir: sites/form-builder
    buildCommand: cd ../.. && pnpm install && pnpm --filter "./packages/*" run build && pnpm --filter sdui-site-form-builder run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
