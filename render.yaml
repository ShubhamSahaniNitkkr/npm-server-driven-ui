# Render Blueprint — Dashboard → New → Blueprint → connect repo → Apply
# Docs: DEPLOY-RENDER.md

services:
  - type: web
    name: sdui-docs
    runtime: static
    buildCommand: echo "Static docs — no build"
    staticPublishPath: sites/docs

  - type: web
    name: sdui-user-management
    runtime: static
    buildCommand: bash scripts/render-build.sh sdui-site-user-management
    staticPublishPath: sites/user-management/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: sdui-crm-dashboard
    runtime: static
    buildCommand: bash scripts/render-build.sh sdui-site-crm-dashboard
    staticPublishPath: sites/crm-dashboard/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: sdui-analytics-dashboard
    runtime: static
    buildCommand: bash scripts/render-build.sh sdui-site-analytics-dashboard
    staticPublishPath: sites/analytics-dashboard/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: sdui-form-builder
    runtime: static
    buildCommand: bash scripts/render-build.sh sdui-site-form-builder
    staticPublishPath: sites/form-builder/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
