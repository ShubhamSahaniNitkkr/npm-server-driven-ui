services:
  - type: web
    name: sdui-analytics-dashboard
    runtime: static
    rootDir: sites/analytics-dashboard
    buildCommand: cd ../.. && pnpm install && pnpm --filter "./packages/*" run build && pnpm --filter sdui-site-analytics-dashboard run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
